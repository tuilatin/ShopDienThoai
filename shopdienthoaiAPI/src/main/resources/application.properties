spring.application.name=shopdienthoaiAPI
# ===================================================
# 1. SERVER CONFIGURATION
# ===================================================
server.port=8081

# ===================================================
# 2. POSTGRESQL DATASOURCE CONFIGURATION
# ===================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ShopBanHang
spring.datasource.username=postgres
# Set this to the password configured in pgAdmin.
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================
# 3. JPA AND HIBERNATE CONFIGURATION
# ===================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Validate the entity mapping without changing the existing database schema.
spring.jpa.hibernate.ddl-auto=none

# Print SQL statements to the console.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep table and column names as declared in the entities.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

